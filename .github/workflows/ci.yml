name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: 'secret-key-ci-not-for-prod'
      DATABASE_URL: 'postgresql://test_user:test_password@127.0.0.1:5432/test_db'
      CELERY_BROKER_URL: 'redis://127.0.0.1:6379/0'
      REDIS_URL: 'redis://127.0.0.1:6379/0'
      CORS_ALLOWED_ORIGINS: 'http://localhost:3000,http://127.0.0.1:3000'
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Django system check
        run: python manage.py check

      - name: Check missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: pytest --cov=. --cov-fail-under=80

  docker-build:
    name: Build Docker Image (Backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: backend:ci-test

          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: CD Deployment Simulation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ backend, docker-build ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: ShellCheck Linting
        uses: ludeeus/action-shellcheck@master
        with:
          scans: scripts

      - name: Make Script Executable
        run: chmod +x scripts/deploy.sh

      - name: Run Deploy Script (Dry Run)
        run: ./scripts/deploy.sh production --dry-run