name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  ruff:
    name: Run Ruff Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Make manage.py executable
        run: chmod +x manage.py

      - name: Run Ruff check
        run: ruff check .

  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: 'secret-key-ci-not-for-prod'
      DATABASE_URL: 'postgresql://test_user:test_password@127.0.0.1:5432/test_db'
      CELERY_BROKER_URL: 'redis://127.0.0.1:6379/0'
      REDIS_URL: 'redis://127.0.0.1:6379/1'
      CORS_ALLOWED_ORIGINS: 'http://localhost:3000,http://127.0.0.1:3000'
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Django system check
        run: python manage.py check

      - name: Check missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: pytest --cov=. --cov-fail-under=80

  smoke-test:
    name: Run End-to-End Smoke Test
    runs-on: ubuntu-latest
    needs: [ backend, docker-build ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Fix scripts permissions and line endings
        run: |
          sed -i 's/\r$//' scripts/*.sh
          chmod +x scripts/*.sh
          sed -i 's/\r$//' docker-entrypoint.sh
          chmod +x docker-entrypoint.sh

      - name: Build and start Docker stack
        run: docker compose up -d --build

      - name: Wait for services to become healthy
        run: |
          echo "Waiting for all containers to be fully healthy..."
          for i in {1..30}; do
            CONTAINERS=$(docker compose ps -q)
            ALL_HEALTHY=true
          
            for cid in $CONTAINERS; do
              HEALTH_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no_healthcheck{{end}}' "$cid")
              if [ "$HEALTH_STATUS" != "healthy" ] && [ "$HEALTH_STATUS" != "no_healthcheck" ]; then
                ALL_HEALTHY=false
                break
              fi
            done
          
            if [ "$ALL_HEALTHY" = true ] && [ -n "$CONTAINERS" ]; then
              echo "All services are healthy!"
              docker compose ps
              exit 0
            fi
          
            echo "Waiting... ($i/30)"
            sleep 5
          done
          echo "Timeout waiting for services to become healthy"
          docker compose ps
          exit 1

      - name: Run Smoke Tests
        run: ./scripts/smoke.sh

      - name: Show Docker Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Clean up Docker containers
        if: always()
        run: docker compose down -v

  docker-build:
    name: Build Docker Image (Backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: backend:ci-test

          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: CD Deployment Simulation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ backend, docker-build ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: ShellCheck Linting
        uses: ludeeus/action-shellcheck@master
        with:
          scans: scripts

      - name: Make Script Executable
        run: chmod +x scripts/deploy.sh

      - name: Run Deploy Script (Dry Run)
        run: ./scripts/deploy.sh production --dry-run